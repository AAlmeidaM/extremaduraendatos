[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extremadura-en-datos"
version = "0.1.0"
description = "Ingesta y unificación de indicadores regionales/provinciales (INE y otras fuentes)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
